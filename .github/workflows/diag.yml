# Laver en diagnose af push-notifikationerne og lægger rapporten på grenen "diag".
name: Push-diagnose

on:
  push:
    branches: [main]
    paths:
      - "tools/push-diagnose.mjs"
      - ".github/workflows/diag.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node tools/push-diagnose.mjs
        env:
          PUSH_EMAIL: ${{ secrets.PUSH_EMAIL }}
          PUSH_PASSWORD: ${{ secrets.PUSH_PASSWORD }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Gem rapporten på grenen diag
        run: |
          mkdir -p /tmp/out && cp push-diagnose.txt /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan diag
          git rm -rq --cached . && git clean -fdq
          cp /tmp/out/push-diagnose.txt .
          git add push-diagnose.txt
          git commit -qm "Push-diagnose"
          git push -f origin diag
